# Русские строки. Плейсхолдеры: {name}. Ключи должны совпадать с en.yaml
# (это проверяет юнит-тест).

app:
  tagline: "диагностика сети и измерение цензуры"
  demo_banner: "ДЕМО — симулированная сеть, а не реальные измерения"

status:
  ok: "Работает"
  throttled: "Замедлен"
  partial: "Частично заблокирован"
  blocked: "Заблокирован"
  unreachable: "Нет связи"
  unknown: "Неизвестно"

summary:
  ok: "работают"
  throttled: "замедлены"
  partial: "частично заблокированы"
  blocked: "заблокированы"

conf:
  high: "высокая уверенность"
  medium: "средняя уверенность"
  low: "низкая уверенность"

conn:
  mobile: "мобильный"
  fixed: "проводной"
  unknown: "тип подключения неизвестен"

kind:
  ok:
    title: "Вмешательства не обнаружено"
    explain: "Все проверки пройдены: имя разрешается правильно, соединение устанавливается, данные идут нормально."
  no_connectivity:
    title: "Нет связи"
    explain: "Не отвечают даже контрольные сайты. Либо интернет отключён (например, шатдаун мобильной сети), либо устройство не в сети. Судить об отдельных сервисах сейчас нельзя."
  tls_mitm:
    title: "Перехват TLS (MITM)"
    explain: "Сайт предъявил сертификат, который его владелец выпустить не мог: он подписан неожиданным удостоверяющим центром. Кто-то на пути может читать или менять трафик. Не вводите пароли через это соединение."
  blockpage:
    title: "Страница-заглушка провайдера"
    explain: "Вместо сайта провайдер вернул свою страницу или редирект с сообщением об ограничении доступа."
  dns:
    title: "Подмена DNS"
    explain: "Ваш DNS-резолвер отвечает неправильно (домена «не существует», адрес-заглушка или непубличный адрес), а независимые шифрованные резолверы возвращают настоящий адрес."
  sni_dpi:
    title: "DPI-блокировка по имени сайта (SNI)"
    explain: "Соединение открывается, но обрывается в момент, когда в TLS-рукопожатии передаётся имя сайта. Тот же сервер отвечает, если передать другое имя или не передавать его вовсе, — значит, фильтр реагирует на имя, а не на адрес."
  ip_block:
    title: "Блокировка по IP-адресу"
    explain: "Адрес сервера вообще не принимает соединения из вашей сети, хотя другие сайты работают."
  tls_reset:
    title: "Сброс TLS-соединения"
    explain: "Соединение рвётся во время TLS-рукопожатия независимо от имени сайта. Фильтрация идёт по адресу и порту или по сигнатуре протокола."
  throttle_freeze:
    title: "Замедление: передача замирает"
    explain: "Соединение работает, но после первых килобайт данные перестают приходить, и загрузка зависает. Это совпадает с шаблоном «16–20 КБ», который применяют к зарубежным хостингам и CDN."
  throttle_rate:
    title: "Замедление: низкая скорость"
    explain: "Данные идут, но гораздо медленнее, чем с отечественных серверов на том же подключении."
  quic_sni:
    title: "QUIC/HTTP3 фильтруется по имени сайта"
    explain: "QUIC-пакеты с именем этого сайта остаются без ответа, а QUIC с другим именем работает. Браузеры обычно переключаются на обычный HTTPS, он может быть медленнее."
  quic_blocked:
    title: "QUIC/HTTP3 недоступен"
    explain: "Ни одно QUIC-рукопожатие не проходит, хотя обычный HTTPS работает. Вероятно, фильтруется UDP-трафик."
  ech_blocked:
    title: "Encrypted Client Hello заблокирован"
    explain: "Рукопожатие, скрывающее имя сайта с помощью ECH, не проходит, а обычное проходит."
  timeout:
    title: "Таймаут"
    explain: "Сервис не ответил вовремя, а явной сигнатуры блокировки нет. Возможна проблема на сервере или нестабильная фильтрация."
  unknown:
    title: "Недостаточно данных"
    explain: "Проверки не дали однозначного результата."

