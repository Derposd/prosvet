name: Map

# Aggregates results/**/*.json into the static public map and deploys it to
# GitHub Pages. No server, no database: the data lives in git.

on:
  push:
    branches: [main]
    paths:
      - "results/**"
      - "internal/mapgen/**"
      - "internal/brand/**"
      - "internal/submit/**"
      - "targets/**"
      - "locales/**"
      - "docs/assets/**"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 3 * * *" # daily, so "days ago" markers stay fresh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Validate all result files
        run: go run ./cmd/prosvet-map -results results -validate
      - name: Build the map
        run: go run ./cmd/prosvet-map -results results -out site -assets docs/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
