name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: go test -count=1 ./...
      - name: Test (race, coverage)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -1

  test-32bit:
    # Routers (mips, armv7) are 32-bit: catch int overflows early.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test (GOARCH=386)
        env:
          GOARCH: "386"
        run: go test -short -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: README.md must match README.en.md
        run: diff -u README.en.md README.md
      - name: Wording policy (measurement, not circumvention)
        run: |
          if grep -rniE "обход[а-я]* блокиров" --include='*.md' --include='*.go' --include='*.yaml' --include='*.yml' --include='*.html' --include='*.js' . ; then
            echo "::error::Use 'network diagnostics & censorship measurement' wording (see CONTRIBUTING.md)"
            exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Result files are valid
        run: go run ./cmd/prosvet-map -results results -validate

  cross-build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7", variant: v7 }
          - { goos: linux, goarch: mips, gomips: softfloat, variant: -softfloat }
          - { goos: linux, goarch: mipsle, gomips: softfloat, variant: -softfloat }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          go build -trimpath -ldflags "-s -w" -o prosvet-bin ./cmd/prosvet
          ls -lh prosvet-bin
