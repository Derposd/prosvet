name: Results from issue

# Lets people submit results without git: the "Submit results" issue form is
# validated here (with the code from main, never from the issue) and turned
# into a pull request that a maintainer merges.

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: issue-results-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  to-pr:
    if: contains(github.event.issue.labels.*.name, 'results')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Extract and validate the submission
        id: extract
        env:
          BODY: ${{ github.event.issue.body }} # untrusted: only ever passed through an env var
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          # The validator's message may echo user input, so it is never printed
          # to the log (where "::" lines would be workflow commands).
          if path=$(go run ./cmd/prosvet-map -results results -issue "$RUNNER_TEMP/body.md" 2> "$RUNNER_TEMP/reason.txt"); then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "path=$path" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Submission rejected by the validator."
          fi
      - name: Open a pull request
        if: steps.extract.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          FILE: ${{ steps.extract.outputs.path }}
        run: |
          branch="results/issue-${ISSUE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$FILE"
          git commit -m "results: add submission from #${ISSUE}"
          git push --force origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "results: submission from #${ISSUE}" \
              --body "Created automatically from #${ISSUE}. The file passed validation (format, value ranges, no IP addresses). Closes #${ISSUE}."
          fi
          gh issue comment "$ISSUE" --body "✅ Thank you! The file is valid; a pull request was opened and will appear on the map after merge. / Спасибо! Файл корректен, открыт pull request — данные появятся на карте после слияния."
      - name: Explain the rejection
        if: steps.extract.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          {
            echo "❌ The submission did not pass validation. Please paste the file produced by \`prosvet submit\` without changes."
            echo "Отправка не прошла проверку. Вставьте файл, созданный \`prosvet submit\`, без изменений."
            echo
            echo '```text'
            head -c 600 "$RUNNER_TEMP/reason.txt" | sed 's/```//g'
            echo
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"
      - name: Report unexpected errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body "⚠️ The bot hit an unexpected error while processing this submission; a maintainer will look at it. / Бот столкнулся с непредвиденной ошибкой; мейнтейнер посмотрит вручную."
