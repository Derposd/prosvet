version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - usestdlibvars
    - whitespace
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors are covered by errcheck
        - G115 # integer conversions are bounded by construction
        - G404 # math/rand is only used for timing jitter
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
    revive:
      rules:
        - name: exported
          disabled: false
        - name: var-naming
          disabled: false
  exclusions:
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose, errcheck]
      # The middlebox simulator plays the censor and must hold raw sockets.
      - path: internal/testnet/
        linters: [gosec, noctx]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Derposd/prosvet
