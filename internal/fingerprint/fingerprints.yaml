# Known block-page and DNS-stub fingerprints.
#
# These are factual indicators (redirect hosts, stub IP addresses, characteristic
# phrases) observed on Russian networks. Many of them were first documented by
# the OONI project (https://github.com/ooni/blocking-fingerprints); this file is
# maintained independently. Add new fingerprints via PR together with evidence
# (a report or an OONI measurement link).
#
# match: prefix | contains | exact
version: 1

dns:
  - { id: ru.rostelecom.1, ip: 95.167.13.50, isp: Rostelecom }
  - { id: ru.rostelecom.2, ip: 95.167.13.51, isp: Rostelecom }
  - { id: ru.rostelecom.3, ip: 217.148.54.171, isp: Rostelecom }
  - { id: ru.ertelecom.1, ip: 5.3.3.17, isp: ER-Telecom }
  - { id: ru.ertelecom.2, ip: 188.186.146.207, isp: ER-Telecom }
  - { id: ru.ertelecom.3, ip: 188.186.146.208, isp: ER-Telecom }
  - { id: ru.ertelecom.4, ip: 188.186.154.79, isp: ER-Telecom }
  - { id: ru.ertelecom.5, ip: 188.186.154.88, isp: ER-Telecom }
  - { id: ru.national.1, ip: 62.33.207.196 }
  - { id: ru.national.2, ip: 62.33.207.197 }
  - { id: ru.netbynet, ip: 212.1.226.59, isp: NetByNet }
  - { id: ru.skynet, ip: 185.37.129.10, isp: SkyNet }
