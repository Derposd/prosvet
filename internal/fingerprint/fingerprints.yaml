  - { id: ru.rostelecom.block, where: location, match: prefix, pattern: "http://block.rt.ru" }
  - { id: ru.mgts.blocked, where: location, match: contains, pattern: "blocked.mgts.ru" }
  - { id: ru.mgts.block, where: location, match: contains, pattern: "block.mgts.ru" }
  - { id: ru.tele2.location, where: location, match: prefix, pattern: "http://t2blocked.com" }
  - { id: ru.tele2.body, where: body, match: contains, pattern: "//t2rkn.com/" }
  - { id: ru.ttk.location, where: location, match: prefix, pattern: "http://fz139.ttk.ru" }
  - { id: ru.mts.body, where: body, match: contains, pattern: "subblock.mts.ru" }
  - { id: ru.netbynet.location, where: location, match: prefix, pattern: "http://blocked.netbynet.ru" }
  - { id: ru.akado.location, where: location, match: prefix, pattern: "http://blocked.akado.ru" }
  - { id: ru.westcall.location, where: location, match: prefix, pattern: "http://zapret.westcall.net" }
  - { id: ru.beeline.body, where: body, match: contains, pattern: "beeline.ru/customers/help/safe-beeline" }
  - { id: ru.rkn.eais, where: body, match: contains, pattern: "eais.rkn.gov.ru" }
  - { id: ru.generic.law, where: body, match: contains, pattern: "Доступ к сайту ограничен в соответствии с Федеральными законами" }
